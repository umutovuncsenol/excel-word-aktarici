name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: python -m pip install --disable-pip-version-check -r requirements.txt "pyinstaller>=6,<7"

      - name: Windows uygulamasını oluştur
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ExcelWordAktarici excel_word_aktarici.py

      - name: GitHub Release yayımla
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME .\dist\ExcelWordAktarici.exe --title "Excel Word Aktarıcı $env:GITHUB_REF_NAME" --generate-notes
